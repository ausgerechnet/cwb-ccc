name: Create source distribution & publish on PyPI

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:

  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install CWB
      run: |
        sudo apt-get update
        sudo apt-get install libncurses5-dev libglib2.0-dev libpcre3 libpcre3-dev
        wget https://sourceforge.net/projects/cwb/files/cwb/cwb-3.5/deb/cwb_3.5.0-1_amd64.deb
        wget https://sourceforge.net/projects/cwb/files/cwb/cwb-3.5/deb/cwb-dev_3.5.0-1_amd64.deb
        sudo apt-get install ./cwb_3.5.0-1_amd64.deb
        sudo apt-get install ./cwb-dev_3.5.0-1_amd64.deb
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        make install
    - name: Create source distribution
      run: |
        make compile
        make sdist
    - name: install from sdist (Cython available → cythonize path)
      run: |
        python3 -m venv /tmp/venv1
        /tmp/venv1/bin/pip install setuptools wheel Cython==3.2.9
        /tmp/venv1/bin/pip install --no-build-isolation dist/*.tar.gz
        /tmp/venv1/bin/python -c "from ccc import Corpus"
    - name: install from sdist (Cython absent → committed cl.c fallback path)
      run: |
        python3 -m venv /tmp/venv2
        /tmp/venv2/bin/pip install setuptools wheel
        /tmp/venv2/bin/pip install --no-build-isolation dist/*.tar.gz
        /tmp/venv2/bin/python -c "from ccc import Corpus"
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
